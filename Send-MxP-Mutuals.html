    .eyebrow { color:var(--brass); font-size:.74rem; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }

    .intro p { max-width:58ch; margin:0; color:var(--steel); }
    .fallback { margin:1rem 0 0; padding:1rem 1.15rem; border:1px solid rgba(212,164,61,.28); border-radius:12px; background:var(--panel); color:var(--steel); font-size:.9rem; }
    .fallback a { color:var(--brass); font-weight:700; }
